<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aeternalis · Biblioteca del Atlas</title><style>body{background:#191715;color:#e4d5b3;font:16px/1.6 Georgia,serif;max-width:820px;margin:4rem auto;padding:0 1.5rem}a{color:#cba976}code{color:#e3c88c}section{background:#24211d;padding:1.5rem;border:1px solid #4b3b2a;border-radius:12px}strong{color:#f5dfad}</style></head><body><h1>Aeternalis · Biblioteca del Atlas</h1><p>Fuente colaborativa de datos para el Supermapa de Foroactivo.</p><section><h2>Comprobación de publicación</h2><div id="status">Comprobando archivos publicados…</div></section><p><a href="data/atlas/manifest.json">Ver manifiesto de datos</a> · <a href="https://github.com/Morpheus-Eko/aeternalis">Repositorio GitHub</a></p><script>(async()=>{const el=document.getElementById('status');try{const r=await fetch('data/atlas/manifest.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();el.innerHTML='<strong>Publicación activa.</strong> '+d.counts.places+' lugares · '+d.counts.regions+' regiones · '+d.counts.roads+' rutas propuestas.'}catch(e){el.textContent='No se pudieron leer los datos: '+e.message}})()</script></body></html>
